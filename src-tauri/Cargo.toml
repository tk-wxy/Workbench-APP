[package]
name = "workbench-app"
version = "0.16.0"
description = "Windows Desktop Workbench Utility"
authors = ["you"]
edition = "2021"

[lib]
name = "workbench_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_Com",
  # 原生拖入（中转区 drag-in）：自注册 IDropTarget 所需
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Com_StructuredStorage",
  "Win32_Graphics_Gdi",
  # IShellLinkW::GetPath（.lnk 解析，续119）签名里带 WIN32_FIND_DATAW，需要此 feature 才可见
  "Win32_Storage_FileSystem",
  "implement",
] }
# #[implement] 宏生成 windows_core:: 路径，用 umbrella windows crate 时需把它列为直接依赖
windows-core = "0.58"
walkdir = "2.5"
libloading = "0.8" # 运行时动态加载 Everything64.dll（可选 Everything 搜索引擎）
flate2 = "1.1"
tauri-plugin-store = "2"
enigo = "0.2"
arboard = "3"
image = "0.25"
# 汉字→拼音（增强搜索的拼音匹配，续131）。
# `plain` = 无声调：匹配用不上声调，带声调的输出还是非 ASCII、反而没法拿来做子序列匹配。
# `heteronym` = 多音字全读音：没它「音乐」只会派生出首选读音 yinle，
# 用户搜 yinyue / 网易云音乐搜 wyyyy 全都落空（实测踩到）。
pinyin = { version = "0.11.0", default-features = false, features = ["heteronym", "plain"] }
